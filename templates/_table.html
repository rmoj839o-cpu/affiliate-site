  <h2>ひと目で比較</h2>
  <ol class="quick">
    {% for i in items %}
    <li><a href="#rank{{ i.rank }}">
      <span class="q-rank">{{ i.rank }}</span>
      {% if i.image %}<img src="{{ i.image }}" alt="" width="56" height="56" loading="lazy">{% endif %}
      <span class="q-body">
        {% if i.point %}<mark class="tag">{{ i.point }}</mark>{% endif %}
        <span class="q-name">{{ i.short_name }}</span>
        <span class="q-meta">★{{ "%.2f"|format(i.review_avg) }}（{{ "{:,}".format(i.review_count) }}件）</span>
      </span>
      <span class="q-price">{{ "{:,}".format(i.price) }}円</span>
    </a></li>
    {% endfor %}
  </ol>
