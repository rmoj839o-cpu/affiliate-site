  <h2>比較表</h2>
  <div class="table-wrap">
  <table class="compare">
    <thead><tr><th>順位</th><th>商品</th><th>楽天価格</th><th>評価</th><th>レビュー数</th><th></th></tr></thead>
    <tbody>
    {% for i in items %}
    <tr>
      <td class="rank">{{ i.rank }}</td>
      <td><div class="name">{% if i.image %}<img src="{{ i.image }}" alt="" width="56" height="56" loading="lazy">{% endif %}<span>{% if i.point %}<mark class="tag">{{ i.point }}</mark>{% endif %}{{ i.name|truncate(40, True, "…") }}</span></div></td>
      <td>{{ "{:,}".format(i.price) }}円</td>
      <td>★{{ "%.2f"|format(i.review_avg) }}</td>
      <td>{{ "{:,}".format(i.review_count) }}件</td>
      <td><a class="btn small" href="#rank{{ i.rank }}">詳しく見る</a></td>
    </tr>
    {% endfor %}
    </tbody>
  </table>
  </div>
