# サイト全体の設定
[site]
name = "ひとり暮らし家電えらび"
description = "ひとり暮らしの部屋に合う家電・ガジェットを、楽天市場のレビューデータで比較するサイトです。"
# 公開URL（末尾スラッシュなし）。独自ドメインは GitHub の Settings → Pages → Custom domain と一致させること
url = "https://hitorigurashi-kaden.net"
# 楽天APIのReferer認証に使うURL。楽天アプリの「許可されたWebサイト」を変えるまでは、旧URLのままにしておく（省略時は url）
rakuten_url = "https://rmoj839o-cpu.github.io/affiliate-site"
author = "管理人"
# 運営者プロフィール（トップ・各ページ下・運営者情報ページに表示）
profile = "ひとり暮らし歴15年。毎年冬になると、新しい暖房器具をつい探してしまいます。技術の進歩で毎年のように新しいモデルが出るので、レビューを読み比べて選ぶのが楽しみのひとつです。このサイトでは、その「読み比べ」を、楽天市場のデータを使って毎日自動でやっています。"

[build]
items_per_page = 10        # ランキングに載せる件数
min_review_count = 30      # これ未満のレビュー数の商品は除外
fetch_hits = 30            # 楽天APIから取得する件数（最大30）
ai_refresh_days = 7        # 商品ラインナップが同じなら、AI解説を再生成しない日数
sns_drafts = false         # true にすると、毎日のInstagram投稿案（文章と画像）をGitHubのIssueに届ける

# ---- アフィリエイトID（公開されても問題ない値） ----
# 空のままでもボタンは表示される（その場合は普通のリンクで、報酬は発生しない）
[affiliate]
amazon_tag = "hitorigura049-22"          # Amazonアソシエイトのトラッキングタグ（例: xxxx-22）
valuecommerce_sid = "3785044"   # Yahoo!ショッピング用（バリューコマース MyLink の sid）
valuecommerce_pid = "892729383"   # 同 pid

# ---- 比較カテゴリ ----
# 大きなキーワード（例:「加湿器」）は強いサイトが多いので、「ひとり暮らし×用途」に絞っている
# slug: URL / keyword: 楽天検索語 / ng: 除外キーワード（スペース区切り）
# bands: この金額以下の価格帯別ページを作る（5商品以上集まったときだけ）
# months: この月だけ表示する（季節もの）。省略すると一年中 / {new_year}: 次に迎える正月の年（おせち用）
# group: "food" は季節の特集（食べ物）、"outdoor" はアウトドアとして家電と分けて表示 / min_reviews: ランキングに載せる最低レビュー数（省略時は build の値）
# power: [下限, 上限] を書くと、商品情報から消費電力（W）を読み取って電気代の目安を出す（範囲外の数字は無視）
# image: ページ上部に出すイラスト（static/<image>.webp と .jpg）
# must: 商品名にどれか1つは入っていないといけない言葉（関係ない商品の混入を防ぐ） / min_price・max_price: この範囲外の価格は除外
