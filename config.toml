# サイト全体の設定
[site]
name = "ひとり暮らし家電えらび"
description = "ひとり暮らしの部屋に合う家電・ガジェットを、楽天市場のレビューデータで比較するサイトです。"
# 公開URL（末尾スラッシュなし）。楽天APIのReferer認証にも使うので、楽天アプリの「許可されたWebサイト」と一致させること
url = "https://rmoj839o-cpu.github.io/affiliate-site"
author = "サイト運営者"

[build]
items_per_page = 10        # ランキングに載せる件数
min_review_count = 30      # これ未満のレビュー数の商品は除外
fetch_hits = 30            # 楽天APIから取得する件数（最大30）
ai_refresh_days = 7        # 商品ラインナップが同じなら、AI解説を再生成しない日数

# ---- アフィリエイトID（公開されても問題ない値） ----
# 空のままでもボタンは表示される（その場合は普通のリンクで、報酬は発生しない）
[affiliate]
amazon_tag = "hitorigura049-22"          # Amazonアソシエイトのトラッキングタグ（例: xxxx-22）
valuecommerce_sid = "3785044"   # Yahoo!ショッピング用（バリューコマース MyLink の sid）
valuecommerce_pid = "892729383"   # 同 pid

# ---- 比較カテゴリ ----
# 大きなキーワード（例:「加湿器」）は強いサイトが多いので、「ひとり暮らし×用途」に絞っている
# slug: URL / keyword: 楽天検索語 / ng: 除外キーワード（スペース区切り）
# must: 商品名にどれか1つは入っていないといけない言葉（関係ない商品の混入を防ぐ） / min_price: これ未満の価格は除外
[[categories]]
slug = "desk-humidifier"
title = "卓上加湿器"
keyword = "卓上加湿器"
must = "加湿器"
ng = "中古 フィルター 交換用 部品 業務用"

[[categories]]
slug = "electric-blanket"
title = "電気毛布"
keyword = "電気毛布"
must = "電気毛布 電気敷毛布 電気掛け毛布 電気ブランケット"
ng = "中古 カバーのみ 交換用"

[[categories]]
slug = "sleep-earphones"
title = "寝ホン（睡眠用イヤホン）"
keyword = "睡眠用 イヤホン"
must = "イヤホン"
ng = "中古 イヤーピース 交換用 ケースのみ 耳栓"

[[categories]]
slug = "slim-mobile-battery"
title = "薄型・軽量モバイルバッテリー"
keyword = "モバイルバッテリー 薄型 軽量"
must = "モバイルバッテリー"
ng = "中古 ケース カバー"

[[categories]]
slug = "small-rice-cooker"
title = "一人暮らし向け炊飯器（3合以下）"
keyword = "炊飯器 3合"
must = "炊飯器"
min_price = 3000
ng = "中古 内釜 交換用 部品 パッキン 5合 5.5合 お米 玄米 精米 無洗米 白米 土鍋 萬古焼 ご飯釜 炊飯鍋 羽釜 直火 ガス火"
