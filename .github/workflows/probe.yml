name: probe-pages
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: PageSpeed Insights
        run: |
          mkdir out && cd out
          S=https://hitorigurashi-kaden.net
          for p in / /guide/hitorigurashi-danbou-yasui/ /kerosene-fan-heater/ /guide/touyu-kakaku/; do
            n=$(echo "$p" | tr '/' '_')
            curl -sS -m 120 "https://www.googleapis.com/pagespeedonline/v5/runPagespeed?url=$S$p&strategy=mobile&category=performance&category=seo&category=accessibility&category=best-practices" -o "psi$n.json" -w "$p %{http_code} %{size_download}\n" >> status.txt
            sleep 5
          done
      - name: Push to probe-out branch
        run: |
          cd out
          git init -q -b probe-out
          git config user.name probe; git config user.email probe@example.com
          git add -A; git commit -qm probe
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" probe-out
