name: probe-kerosene
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch the kerosene price survey pages and files
        run: |
          mkdir out && cd out
          B=https://www.enecho.meti.go.jp/statistics/petroleum_and_lpgas/pl007
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/126 Safari/537.36"
          for f in xlsx/261028.xlsx docx/261028.docx; do
            n=$(basename "$f")
            curl -sSL -m 60 -A "$UA" -H "Accept-Language: ja" "$B/$f" -o "$n" -w "$f %{http_code} %{content_type} %{size_download}\n" >> status.txt 2>&1 || echo "$f FAIL" >> status.txt
          done
      - name: Push to probe-out branch
        run: |
          cd out
          git init -q -b probe-out
          git config user.name probe; git config user.email probe@example.com
          git add -A; git commit -qm probe
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" probe-out
