name: probe-pages
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch pages
        run: |
          mkdir out && cd out
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126.0 Safari/537.36"
          B=https://oil-info.ieej.or.jp
          curl -sSL -m 60 -A "$UA" $B/price/price_ippan_lp_maitsuki.html -o m.html -w "maitsuki %{http_code} %{size_download}\n" >> status.txt
          curl -sSL -m 60 -A "$UA" $B/price/price_ippan_lp_gusu.html -o g.html -w "gusu %{http_code} %{size_download}\n" >> status.txt
          curl -sSL -m 60 -A "$UA" $B/documents/data/LPGPRICE.pdf -o p.pdf -w "pdf %{http_code} %{size_download}\n" >> status.txt
          sudo apt-get install -y -qq poppler-utils >/dev/null 2>&1 || true
          pdftotext -layout p.pdf p.txt 2>/dev/null || true
          for f in m g; do python3 -c "import re,sys,html;t=open(sys.argv[1],'rb').read().decode('utf-8','replace');t=re.sub(r'(?s)<(script|style).*?</\1>','',t);t=re.sub(r'</t[dh]>',' | ',t);t=re.sub(r'<[^>]+>','\n',t);print(re.sub(r'\n\s*\n+','\n',html.unescape(t)))" $f.html > $f.txt; grep -o 'href="[^"]*\.\(xls\|xlsx\|pdf\|csv\)"' $f.html > $f.links.txt || true; done
          rm -f *.pdf *.html
      - name: Push to probe-out branch
        run: |
          cd out
          git init -q -b probe-out
          git config user.name probe; git config user.email probe@example.com
          git add -A; git commit -qm probe
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" probe-out
