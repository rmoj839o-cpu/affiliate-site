name: probe-pages
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch pages
        run: |
          mkdir out && cd out
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126.0 Safari/537.36"
          for n in 000159485 000159473 000159568; do curl -sSL -m 60 -A "$UA" "https://www.nite.go.jp/data/$n.pdf" -o $n.pdf -w "$n %{http_code} %{size_download}\n" >> status.txt; done
          curl -sSL -m 40 -A "$UA" https://kyodonewsprwire.jp/release/202510167228 -o pr.html -w "pr %{http_code}\n" >> status.txt
          sudo apt-get install -y -qq poppler-utils >/dev/null 2>&1 || true
          for f in *.pdf; do pdftotext -layout "$f" "${f%.pdf}.txt" 2>/dev/null || true; done
          python3 -c "import re,html;t=open('pr.html','rb').read().decode('utf-8','replace');t=re.sub(r'(?s)<(script|style).*?</\1>','',t);t=re.sub(r'<[^>]+>','\n',t);print(re.sub(r'\n\s*\n+','\n',html.unescape(t)))" > pr.txt
          rm -f *.pdf pr.html
      - name: Push to probe-out branch
        run: |
          cd out
          git init -q -b probe-out
          git config user.name probe; git config user.email probe@example.com
          git add -A; git commit -qm probe
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" probe-out
