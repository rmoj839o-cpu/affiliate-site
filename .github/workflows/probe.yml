name: probe-pages
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch source pages
        run: |
          mkdir out && cd out
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126.0 Safari/537.36"
          get() { curl -sSL -m 40 -A "$UA" -H "Accept-Language: ja" "$2" -o "$1" -w "$1 %{http_code} %{size_download} $2\n" >> status.txt || echo "$1 FAIL $2" >> status.txt; }
          get iris.html https://www.irisohyama.co.jp/products/electrical-appliances/seasonal-appliances/humidifier/ultrasonic/ultrasonic-humidifier-personal-type
          get pana.html https://panasonic.jp/kashitsu/c-db/products/FE-KFS05/spec.html
          get tokyo.html https://www.hokeniryo.metro.tokyo.lg.jp/kankyo/eisei/yomimono/kashitukinoeiseikanri
          get doshisha.pdf https://www.doshisha.co.jp/dcs/wp-content/uploads/2025/09/250918-2.pdf
          get machida.pdf https://www.city.machida.tokyo.jp/iryo/hokenjo/kankyou/gaityu/shitudo_fuyu.files/kashituki.pdf
          get zoji.pdf https://www.zojirushi.co.jp/syohin/assets/cms/materials/catalog_humidifier.pdf
          get nite.html https://www.nite.go.jp/jiko/chuikanki/press/2021fy/prs220126.html
          sudo apt-get install -y -qq poppler-utils >/dev/null 2>&1 || true
          for f in *.pdf; do pdftotext -layout "$f" "${f%.pdf}.txt" 2>/dev/null || true; done
          for f in *.html; do python3 -c "import re,sys,html;t=open(sys.argv[1],'rb').read().decode('utf-8','replace');t=re.sub(r'(?s)<(script|style).*?</\1>','',t);t=re.sub(r'<[^>]+>','\n',t);t=html.unescape(t);print(re.sub(r'\n\s*\n+','\n',t))" "$f" > "${f%.html}.txt"; done
          rm -f *.pdf
      - name: Push to probe-out branch
        run: |
          cd out
          git init -q -b probe-out
          git config user.name probe; git config user.email probe@example.com
          git add -A; git commit -qm probe
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" probe-out
