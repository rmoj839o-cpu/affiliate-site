name: probe-prices
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch Tokyo retail price tables
        run: |
          mkdir out && cd out
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/126 Safari/537.36"
          B=https://www.toukei.metro.tokyo.lg.jp/bukka/2026
          curl -sSL -m 30 -A "$UA" "$B/bk2691data.htm" -o page.html -w "page %{http_code} %{size_download}\n" >> status.txt || echo FAIL >> status.txt
          python3 - <<'PY'
          import re, urllib.parse
          t=open('page.html','rb').read().decode('utf-8','replace')
          links=[urllib.parse.urljoin('https://www.toukei.metro.tokyo.lg.jp/bukka/2026/bk2691data.htm',m) for m in re.findall(r'href="([^"]+\.(?:xlsx|xls|csv|pdf))"',t,re.I)]
          open('links.txt','w').write('\n'.join(links))
          PY
          n=0
          for l in $(cat links.txt); do n=$((n+1)); f="f$n.${l##*.}"; curl -sSL -m 60 -A "$UA" "$l" -o "$f" -w "$l -> $f %{http_code} %{size_download}\n" >> status.txt; done
      - name: Push to probe-out branch
        run: |
          cd out
          git init -q -b probe-out
          git config user.name probe; git config user.email probe@example.com
          git add -A; git commit -qm probe
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" probe-out
