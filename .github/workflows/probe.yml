name: probe-pages
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch pages
        run: |
          mkdir out && cd out
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126.0 Safari/537.36"
          curl -sSL -m 40 -A "$UA" https://www.enecho.meti.go.jp/category/saving_and_new/saving/general/howto/bathtoilet/ -o b.html -w "%{http_code}\n" > status.txt
          python3 -c "import re,sys,html;t=open('b.html','rb').read().decode('utf-8','replace');t=re.sub(r'(?s)<(script|style).*?</\1>','',t);t=re.sub(r'<[^>]+>','\n',t);t=html.unescape(t);print(re.sub(r'\n\s*\n+','\n',t))" > b.txt
          rm b.html
      - name: Push to probe-out branch
        run: |
          cd out
          git init -q -b probe-out
          git config user.name probe; git config user.email probe@example.com
          git add -A; git commit -qm probe
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" probe-out
