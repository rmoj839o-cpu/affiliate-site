name: probe-pages
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch pages
        run: |
          mkdir out && cd out
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126.0 Safari/537.36"
          get() { curl -sSL -m 40 -A "$UA" -H "Accept-Language: ja" "$2" -o "$1.html" -w "$1 %{http_code} %{size_download}\n" >> status.txt || echo "$1 FAIL" >> status.txt; python3 -c "import re,sys,html;t=open(sys.argv[1],'rb').read().decode('utf-8','replace');t=re.sub(r'(?s)<(script|style).*?</\1>','',t);t=re.sub(r'<[^>]+>','\n',t);print(re.sub(r'\n\s*\n+','\n',html.unescape(t)))" "$1.html" > "$1.txt"; rm -f "$1.html"; }
          get nhk https://news.web.nhk/newsweb/na/nd-20261124de80343
          get cbc https://news.yahoo.co.jp/articles/4c5e00e8be87dc12e5801257a8467e52bc35b91e
          get minyu https://www.minyu-net.com/news/detail/2026112407164757605
          get ctv https://news.yahoo.co.jp/articles/594b17f0eab11f64c124fc765e467e45763d488b
      - name: Push to probe-out branch
        run: |
          cd out
          git init -q -b probe-out
          git config user.name probe; git config user.email probe@example.com
          git add -A; git commit -qm probe
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" probe-out
