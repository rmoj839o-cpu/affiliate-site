name: build-and-deploy

on:
  schedule:
    - cron: "47 20 * * *"   # 毎日 日本時間 5:47 に自動更新
  workflow_dispatch:         # Actions画面から手動実行も可能
  push:                      # 仕組みを更新したときもすぐ反映する
    branches: [main]
    paths-ignore: ["data/**", "README.md"]

permissions:
  contents: write   # AI解説のキャッシュ(data/)をコミットするため
  issues: write     # SNS投稿案をIssueとして届けるため
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Install Japanese font for SNS images
        # 投稿案の画像を作るときだけ使う。取得に時間がかかってもサイトの更新は止めない
        timeout-minutes: 5
        continue-on-error: true
        run: sudo apt-get update -qq && sudo apt-get install -y -qq fonts-noto-cjk

      - name: Build site
        env:
          RAKUTEN_APP_ID: ${{ secrets.RAKUTEN_APP_ID }}
          RAKUTEN_ACCESS_KEY: ${{ secrets.RAKUTEN_ACCESS_KEY }}
          RAKUTEN_AFFILIATE_ID: ${{ secrets.RAKUTEN_AFFILIATE_ID }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python -m autosite.build

      - name: Save AI content cache
        # 記録の保存に失敗しても、サイトの公開は止めない
        continue-on-error: true
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if ! git diff --cached --quiet; then
            git commit -m "Update content cache [skip ci]"
            git pull --rebase origin main
            git push
          fi

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deploy
        uses: actions/deploy-pages@v4

      - name: Post SNS drafts as an issue
        if: hashFiles('drafts.md') != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # 前日の投稿案は閉じて、今日の分だけを開いておく
          gh label create sns-draft --color 1a73e8 --force
          gh issue list --label sns-draft --state open --json number --jq '.[].number' | xargs -r -n1 gh issue close
          gh issue create --title "SNS投稿案 $(TZ=Asia/Tokyo date +%m/%d)" --body-file drafts.md --label sns-draft
