<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 290" role="img" aria-label="炊飯器の保温時間ごとの電気代と、冷凍ごはんを電子レンジで温める1回の電気代のくらべ">
<rect width="360" height="290" rx="12" fill="#fffdf8"/>
<text x="180" y="26" text-anchor="middle" font-size="15" font-weight="700" fill="#1f2328" font-family="Hiragino Sans, Noto Sans JP, sans-serif">保温は何時間で、レンジ1回をこえる？</text>
<text x="180" y="44" text-anchor="middle" font-size="10" font-weight="400" fill="#5f6670" font-family="Hiragino Sans, Noto Sans JP, sans-serif">保温 約0.56円/時間・レンジで温め直し1回 約2円（1kWh＝31円）</text>
<rect x="30" y="220" width="36" height="10" rx="5" fill="#9aa3ad"/>
<text x="48" y="214.0" text-anchor="middle" font-size="11.5" font-weight="700" fill="#1f2328" font-family="Hiragino Sans, Noto Sans JP, sans-serif">0.6円</text>
<text x="48" y="246" text-anchor="middle" font-size="11" font-weight="400" fill="#1f2328" font-family="Hiragino Sans, Noto Sans JP, sans-serif">1時間</text>
<rect x="82" y="212" width="36" height="18" rx="5" fill="#9aa3ad"/>
<text x="100" y="205.66666666666666" text-anchor="middle" font-size="11.5" font-weight="700" fill="#1f2328" font-family="Hiragino Sans, Noto Sans JP, sans-serif">1.1円</text>
<text x="100" y="246" text-anchor="middle" font-size="11" font-weight="400" fill="#1f2328" font-family="Hiragino Sans, Noto Sans JP, sans-serif">2時間</text>
<rect x="134" y="193" width="36" height="37" rx="5" fill="#bf0000"/>
<text x="152" y="187.33333333333331" text-anchor="middle" font-size="11.5" font-weight="700" fill="#1f2328" font-family="Hiragino Sans, Noto Sans JP, sans-serif">2.2円</text>
<text x="152" y="246" text-anchor="middle" font-size="11" font-weight="400" fill="#1f2328" font-family="Hiragino Sans, Noto Sans JP, sans-serif">4時間</text>
<rect x="186" y="157" width="36" height="73" rx="5" fill="#bf0000"/>
<text x="204" y="150.66666666666666" text-anchor="middle" font-size="11.5" font-weight="700" fill="#1f2328" font-family="Hiragino Sans, Noto Sans JP, sans-serif">4.4円</text>
<text x="204" y="246" text-anchor="middle" font-size="11" font-weight="400" fill="#1f2328" font-family="Hiragino Sans, Noto Sans JP, sans-serif">8時間</text>
<rect x="238" y="118" width="36" height="112" rx="5" fill="#bf0000"/>
<text x="256" y="112.33333333333333" text-anchor="middle" font-size="11.5" font-weight="700" fill="#1f2328" font-family="Hiragino Sans, Noto Sans JP, sans-serif">6.7円</text>
<text x="256" y="246" text-anchor="middle" font-size="11" font-weight="400" fill="#1f2328" font-family="Hiragino Sans, Noto Sans JP, sans-serif">12時間</text>
<rect x="290" y="82" width="36" height="148" rx="5" fill="#bf0000"/>
<text x="308" y="75.66666666666666" text-anchor="middle" font-size="11.5" font-weight="700" fill="#1f2328" font-family="Hiragino Sans, Noto Sans JP, sans-serif">8.9円</text>
<text x="308" y="246" text-anchor="middle" font-size="11" font-weight="400" fill="#1f2328" font-family="Hiragino Sans, Noto Sans JP, sans-serif">16時間</text>
<line x1="22" y1="197" x2="338" y2="197" stroke="#2c6fb7" stroke-width="2" stroke-dasharray="5 4"/>

<text x="180" y="276" text-anchor="middle" font-size="11.5" font-weight="700" fill="#1f2328" font-family="Hiragino Sans, Noto Sans JP, sans-serif">4時間をこえると、冷凍してレンジで温め直すほうが安い</text>
<line x1="30" y1="66" x2="58" y2="66" stroke="#2c6fb7" stroke-width="2" stroke-dasharray="5 4"/><text x="64" y="70" text-anchor="start" font-size="10.5" font-weight="700" fill="#2c6fb7" font-family="Hiragino Sans, Noto Sans JP, sans-serif">＝レンジで温め直し1回（約2円）</text>
</svg>