<text x="180" y="44" text-anchor="middle" font-size="10.5" font-weight="400" fill="#5f6670" font-family="Hiragino Sans, Noto Sans JP, sans-serif">電気1kWh＝31円、灯油1L＝140円で計算</text>
<line x1="128" y1="56" x2="128" y2="266" stroke="#e3e3dc"/>
