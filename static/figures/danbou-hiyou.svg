<text x="180" y="298" text-anchor="middle" font-size="10.5" font-weight="400" fill="#5f6670" font-family="Hiragino Sans, Noto Sans JP, sans-serif">電気毛布とこたつは体のまわり、ほかは部屋全体を暖めます</text>
