<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 344" role="img" aria-label="ローリングストックの回し方">
<rect width="360" height="344" rx="12" fill="#fffdf8"/>
<text x="180" y="26" text-anchor="middle" font-size="15" font-weight="700" fill="#1f2328" font-family="Hiragino Sans, Noto Sans JP, sans-serif">ローリングストックの回し方</text>
<g transform="translate(10,44)"><rect width="164" height="116" rx="10" fill="#ffffff" stroke="#e3e3dc"/>
<circle cx="20" cy="22" r="12" fill="#bf0000"/><text x="20" y="27" text-anchor="middle" font-size="14" font-weight="700" fill="#fff" font-family="Hiragino Sans, Noto Sans JP, sans-serif">1</text>
<text x="40" y="27" text-anchor="start" font-size="13" font-weight="700" fill="#1f2328" font-family="Hiragino Sans, Noto Sans JP, sans-serif">少し多めに買う</text>
<text x="82" y="62" text-anchor="middle" font-size="11.5" font-weight="400" fill="#1f2328" font-family="Hiragino Sans, Noto Sans JP, sans-serif">いつもの買い物で</text>
<text x="82" y="82" text-anchor="middle" font-size="11.5" font-weight="400" fill="#1f2328" font-family="Hiragino Sans, Noto Sans JP, sans-serif">1〜2食ぶん多めに</text>
</g>
<g transform="translate(185,44)"><rect width="164" height="116" rx="10" fill="#ffffff" stroke="#e3e3dc"/>
<circle cx="20" cy="22" r="12" fill="#bf0000"/><text x="20" y="27" text-anchor="middle" font-size="14" font-weight="700" fill="#fff" font-family="Hiragino Sans, Noto Sans JP, sans-serif">2</text>
<text x="40" y="27" text-anchor="start" font-size="13" font-weight="700" fill="#1f2328" font-family="Hiragino Sans, Noto Sans JP, sans-serif">新しいものは奥へ</text>
<text x="82" y="62" text-anchor="middle" font-size="11.5" font-weight="400" fill="#1f2328" font-family="Hiragino Sans, Noto Sans JP, sans-serif">期限を箱に大きく書いて</text>
<text x="82" y="82" text-anchor="middle" font-size="11.5" font-weight="400" fill="#1f2328" font-family="Hiragino Sans, Noto Sans JP, sans-serif">古いものを手前に</text>
</g>
<g transform="translate(185,196)"><rect width="164" height="116" rx="10" fill="#ffffff" stroke="#e3e3dc"/>
<circle cx="20" cy="22" r="12" fill="#bf0000"/><text x="20" y="27" text-anchor="middle" font-size="14" font-weight="700" fill="#fff" font-family="Hiragino Sans, Noto Sans JP, sans-serif">3</text>
<text x="40" y="27" text-anchor="start" font-size="13" font-weight="700" fill="#1f2328" font-family="Hiragino Sans, Noto Sans JP, sans-serif">手前から食べる</text>
<text x="82" y="62" text-anchor="middle" font-size="11.5" font-weight="400" fill="#1f2328" font-family="Hiragino Sans, Noto Sans JP, sans-serif">月に1回「備えの日」に</text>
<text x="82" y="82" text-anchor="middle" font-size="11.5" font-weight="400" fill="#1f2328" font-family="Hiragino Sans, Noto Sans JP, sans-serif">古いものを食べる</text>
</g>
<g transform="translate(10,196)"><rect width="164" height="116" rx="10" fill="#ffffff" stroke="#e3e3dc"/>
<circle cx="20" cy="22" r="12" fill="#bf0000"/><text x="20" y="27" text-anchor="middle" font-size="14" font-weight="700" fill="#fff" font-family="Hiragino Sans, Noto Sans JP, sans-serif">4</text>
<text x="40" y="27" text-anchor="start" font-size="13" font-weight="700" fill="#1f2328" font-family="Hiragino Sans, Noto Sans JP, sans-serif">食べたぶん買い足す</text>
<text x="82" y="62" text-anchor="middle" font-size="11.5" font-weight="400" fill="#1f2328" font-family="Hiragino Sans, Noto Sans JP, sans-serif">同じものを買って</text>
<text x="82" y="82" text-anchor="middle" font-size="11.5" font-weight="400" fill="#1f2328" font-family="Hiragino Sans, Noto Sans JP, sans-serif">また奥へしまう</text>
</g>
<path d="M172 100 H182" stroke="#bf0000" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M177 95 L183 100 L177 105" stroke="#bf0000" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M267 162 V192" stroke="#bf0000" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M262 186 L267 193 L272 186" stroke="#bf0000" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M184 254 H174" stroke="#bf0000" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M179 249 L173 254 L179 259" stroke="#bf0000" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M92 192 V162" stroke="#bf0000" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M87 168 L92 161 L97 168" stroke="#bf0000" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
<text x="180" y="336" text-anchor="middle" font-size="11.5" font-weight="400" fill="#5f6670" font-family="Hiragino Sans, Noto Sans JP, sans-serif">いつも同じ量の備えが、家にあるまま入れかわる</text>
</svg>